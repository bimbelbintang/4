function tone(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}
function hit(t,v,d){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=3000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d)}

 const mk=(id,arr,cur,fn,dis)=>{const el=$(id);arr.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.className=cur(i)?'on':'';if(dis&&dis(i)){b.disabled=true}b.onclick=()=>fn(i);el.appendChild(b)})};
 const tk=Object.keys(TH);

function start(){if(!unlocked(sel.th,sel.lv))return;music(sel.th);$('menu').hidden=true;$('end').hidden=true;['hud','q'].forEach(i=>$(i).hidden=false);$('m').hidden=true;
 let mi;do{mi=R(0,MO.length-1)}while(mi===lastMood);lastMood=mi;build(sel.th,Object.keys(S.med).length,MO[mi]);qs=makeQs(sel.lv,sel.th);qi=0;score=0;vy=0;lives=1;bdone=-1;bq=null;yaw=Math.PI*.1;showQ();upHud();toast('Suasana: '+MO[mi].n,'#fff')}

  if(qi>=20)return setTimeout(finish,900);setTimeout(mission,900)}
 else wrong(b,'Jawaban salah')}

 let x,z;if(inB){const a=Math.random()*6.28,r=R(0,5);x=BX+Math.cos(a)*r;z=Math.sin(a)*r}else{const a=Math.random()*6.28,r=R(6,15);x=AX+Math.cos(a)*r;z=Math.sin(a)*r}

 $('q').hidden=true;$('m').hidden=true;if(mark)scene.remove(mark);
 boom(60);const nt=TH[TK[TK.indexOf(sel.th)+1]];const nx=sel.lv<2?`<p style="text-align:center">🔓 Level ${LV[sel.lv+1]} terbuka!</p>`:'<p style="text-align:center">🎓 Level Sulit selesai! Coba tema lain juga!</p>';

 $('end').hidden=false;$('e1').onclick=start;$('e2').onclick=menu;hero.add(cone(.4,.5,0xffc93c,0,2.8,0,hero,5))}

function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 npcs.forEach(n=>{const u=n.userData,dx=u.tx-n.position.x,dz=u.tz-n.position.z,d=Math.hypot(dx,dz);if(d<.6){const a=Math.random()*6.28,r=Math.random()*u.rad;u.tx=u.home+Math.cos(a)*r;u.tz=Math.sin(a)*r}else{n.position.x+=dx/d*2*dt;n.position.z+=dz/d*2*dt;n.rotation.y=Math.atan2(dx,dz);n.position.y=Math.abs(Math.sin(t*6))*.12}});
 if(rain){const q=rain.geometry.attributes.position;for(let i=0;i<q.count;i++){let y=q.getY(i)-35*dt;if(y<0)y=30;q.setY(i,y)}q.needsUpdate=true;rain.position.set(hero.position.x,0,hero.position.z)}

 else{

   if(d<2.2&&hero.position.y<2){state='wait';scene.remove(mark);mark=null;if(mT>0){score+=5;toast('Tepat waktu! +5 ⭐','#ffc93c')}else toast('Peran selesai! 👍','#fff');upHud();vy=9;setTimeout(()=>{if(state=='wait')showQ()},900)}}
  const p=hero.position;cam.position.set(p.x+Math.sin(yaw)*Math.cos(pitch)*9,p.y+1.5+Math.sin(pitch)*9,p.z+Math.cos(yaw)*Math.cos(pitch)*9);cam.lookAt(p.x,p.y+1.6,p.z)}
